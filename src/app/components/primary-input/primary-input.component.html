<div class="input-wrapper">
  <label [for]="formName">{{ label }}</label>

  <div class="input-container">
    <input
      [id]="formName"
      [type]="type"
      [placeholder]="placeholder"
      [value]="value"
      [disabled]="disabled"
      (input)="handleInput($event)"
      (blur)="onTouched()"
    >
    <div class="icon">
      <img [src]="icon" alt="">
    </div>
  </div>
</div>
